[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "GPL-3.0-or-later", "GPL-3.0-only",
    # ksni (the Linux tray): a public-domain dedication, compatible with the GPL.
    "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# Unmaintained crates that only come in through Slint, zbus or the tray (none of them ours to swap) are
# reported, not blocking. Vulnerabilities always block.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
