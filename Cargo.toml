[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/EncidXVII/WristXR"
homepage = "https://everyvr.net/wristxr"
rust-version = "1.85"

[workspace.dependencies]
wxr-core = { path = "crates/core" }
wxr-osc = { path = "crates/osc" }
wxr-notify-api = { path = "crates/notify-api" }
wxr-vr = { path = "crates/vr" }
wxr-sys = { path = "crates/sys" }
wxr-ui = { path = "crates/ui" }
wxr-gfx-d3d11 = { path = "crates/gfx-d3d11" }
wxr-capture-win = { path = "crates/capture-win" }
wxr-input-win = { path = "crates/input-win" }
wxr-gfx-vk = { path = "crates/gfx-vk" }
wxr-desktop-linux = { path = "crates/desktop-linux" }
ash = "0.38"
x11rb = { version = "0.14", features = ["randr", "shm", "composite", "xtest", "xfixes", "damage", "xkb"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"
tracing = "0.1"
directories = "6"
fluent = "0.17"
tray-icon = "0.26"
insta = "1"
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
