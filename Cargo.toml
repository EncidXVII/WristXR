[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
dvr-core = { path = "crates/core" }
dvr-osc = { path = "crates/osc" }
dvr-notify-api = { path = "crates/notify-api" }
dvr-vr = { path = "crates/vr" }
dvr-sys = { path = "crates/sys" }
dvr-ui = { path = "crates/ui" }
dvr-gfx-d3d11 = { path = "crates/gfx-d3d11" }
dvr-capture-win = { path = "crates/capture-win" }
dvr-input-win = { path = "crates/input-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.10"
tracing = "0.1"
directories = "6"
fluent = "0.17"
tray-icon = "0.26"
insta = "1"
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Media",
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
