name: release
# Tag vX.Y.Z -> draft GitHub release with the Windows zip, Linux tarballs and SHA-256 files.
# Signing (SignPath) and the Steam depot upload are separate, manual steps (see packaging/).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/windows/release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*.zip*
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/linux/tarball.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz*
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --draft --repo "${{ github.repository }}" --title "${{ github.ref_name }}"
