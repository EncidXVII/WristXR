name: release
# Tag vX.Y.Z -> the Windows zip, Linux tarballs and SHA-256 files, kept as this run's artifacts. The release itself is
# published by hand from the maintainer's account (RELEASING.md), so no bot appears as its author.
# Signing (SignPath) and the Steam depot upload are separate, manual steps (see packaging/).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/windows/release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*.zip*
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/linux/tarball.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz*
