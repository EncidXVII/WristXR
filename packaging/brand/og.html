<!doctype html>
<!-- Social preview (1280x640): the card shown when the repository's link is shared. Render: packaging/brand/render-og.ps1 -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url("../../crates/ui/fonts/Anton-Regular.ttf")}
@font-face{font-family:Barlow;font-weight:400;src:url("../../crates/ui/fonts/Barlow-Regular.ttf")}
@font-face{font-family:Barlow;font-weight:600;src:url("../../crates/ui/fonts/Barlow-SemiBold.ttf")}
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0B0B0C;color:#F5F5F7;font-family:Barlow,sans-serif}
.name{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:16px;font:400 40px/1 Anton,sans-serif;letter-spacing:.5px;text-transform:uppercase}
.name img{width:56px;height:56px}
.c{position:absolute;left:64px;top:156px;width:620px;display:flex;flex-direction:column;gap:26px}
.t{font:400 74px/1.04 Anton,sans-serif;text-transform:uppercase;white-space:nowrap}
.t em{font-style:normal;color:#C6FF1A}
.s{width:560px;font-size:27px;line-height:1.36;color:#A8A8AF}
.b{position:absolute;left:64px;bottom:52px;display:flex;gap:12px;font-size:22px;font-weight:600}
.b span{padding:11px 18px;border-radius:12px;background:#1D1D20;color:#F5F5F7}
.b span.a{background:#C6FF1A;color:#0B0B0C}
.shot{position:absolute;border-radius:22px;border:1px solid #2A2A2E;box-shadow:0 24px 60px rgba(0,0,0,.6)}
/* The desktop screen cut out of screen-and-watch.png at its own size (1000x525), then scaled; the watch on top is the sharp wrist.png */
.screen{position:absolute;left:0;top:0;width:1000px;height:525px;overflow:hidden;border-radius:22px;transform-origin:0 0;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.screen img{position:absolute;left:-56px;top:-163px}
.watch{position:absolute;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
</style></head><body>
<div class="screen" style="transform:translate(712px,112px) scale(.548)"><img src="../../docs/img/screen-and-watch.png" alt=""></div>
<img class="shot" src="../../docs/img/keyboard.png" alt="" style="right:20px;bottom:28px;width:548px">
<img class="watch" src="../../docs/img/wrist.png" alt="" style="right:20px;top:34px;width:450px">
<div class="name"><img src="wristxr-mark.svg" alt="">WristXR</div>
<div class="c"><div class="t">VR desktop overlay<br>with <em>wrist clock</em></div><div class="s">Screens and windows in VR, laser pointer, VR keyboard, VRChat chatbox and Discord on your wrist. SteamVR on Windows and Linux.</div></div>
<div class="b"><span class="a">Free and open source</span><span>under 0.1 ms GPU per frame</span></div>
</body></html>
